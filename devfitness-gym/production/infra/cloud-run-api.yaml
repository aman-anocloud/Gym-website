apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: devfitness-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/devfitness/api:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: WHATSAPP_DRY_RUN
              value: "false"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
