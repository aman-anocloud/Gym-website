apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: devfitness-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/devfitness/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://api.devfitness.in
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
